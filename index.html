<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard UI</title>
    <link rel="stylesheet" href="scss/main.css" />
    <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
    <link
      href="https://fonts.cdnfonts.com/css/helvetica-neue-5"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- navbar -->
    <main>
      <nav class="top-bar">
        <div class="top-bar__breadcrumb">
          <p>Page / Dashboard</p>
          <p>Dashboard</p>
        </div>
        <div class="top-bar__search-bar">
          <p>Type here...</p>
        </div>

        <div class="top-bar__profile">
          <p><ion-icon name="person"></ion-icon>Sign in</p>
          <p><ion-icon name="settings-sharp"></ion-icon></p>
          <p><ion-icon name="notifications"></ion-icon></p>
        </div>
      </nav>
    </main>

    <!-- sidebar -->
    <aside class="full-sidebar">
      <header>
        <img src="img/Logo.svg" , alt="logo" class="logo" />
      </header>

      <hr />

      <nav class="sidebar">
        <section class="dashboard-list">
          <p class="dashboard-list__content">
            <ion-icon name="home" class="dashboard-list__icon"></ion-icon>
            Dashboard
          </p>
          <p class="dashboard-list__content">
            <ion-icon
              name="stats-chart"
              class="dashboard-list__icon"
            ></ion-icon>
            Tables
          </p>
          <p class="dashboard-list__content">
            <ion-icon name="card" class="dashboard-list__icon"></ion-icon>
            Billing
          </p>
          <p class="dashboard-list__content">
            <ion-icon name="build" class="dashboard-list__icon"></ion-icon> RTL
          </p>
        </section>

        <h3>ACCOUNT PAGES</h3>

        <section class="account-pages">
          <p class="account-pages__content">
            <ion-icon name="person" class="account-pages__icon"></ion-icon
            >Profile
          </p>
          <p class="account-pages__content">
            <ion-icon name="document" class="account-pages__icon"></ion-icon
            >Sign In
          </p>
          <p class="account-pages__content">
            <ion-icon name="rocket-sharp" class="account-pages__icon"></ion-icon
            >Sign Up
          </p>
        </section>
      </nav>

      <section class="help-card">
        <ion-icon name="help-circle" class="icon icon--documentation"></ion-icon>
        <h6>Need help?</h6>
        <p>Please check our docs</p>
        <p class="help-card__documentation">DOCUMENTATION</p>
      </section>
    </aside>

    <!-- footer -->
    <footer>
      @ 2021, Made with ❤️ by Creative Tim & Simmmple for a better web
    </footer>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
  </body>
</html>
