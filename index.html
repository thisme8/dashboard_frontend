<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard UI</title>
    <link rel="stylesheet" href="scss/main.css" />
    <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
    <link
      href="https://fonts.cdnfonts.com/css/helvetica-neue-5"
      rel="stylesheet"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- navbar -->
    <main>
      <nav class="top-bar">
        <div class="top-bar__breadcrumb">
          <p>
            <span class="top-bar__breadcrumb__previous">Page</span> <span class="top-bar__breadcrumb__current">/ Dashboard</span>
          </p>
          <p class="top-bar__breadcrumb__active">Dashboard</p>
        </div>

        <div class="top-bar__profile">
          <div class="top-bar__profile__search">
             <p> 
            <ion-icon
              name="search"
              class="top-bar__profile__search-icons"
            ></ion-icon>
          Type Here...
        </p>
            </p>
          </div>
          <p class="top-bar__profile__content">
            <ion-icon name="person" class="top-bar__profile__icons"> </ion-icon>
            Sign in
          </p>
          <p class="top-bar__profile__content">
            <ion-icon
              name="settings-sharp"
              class="top-bar__profile__icons"
            ></ion-icon>
          </p>
          <p class="top-bar__profile__content">
            <ion-icon
              name="notifications"
              class="top-bar__profile__icons"
            ></ion-icon>
          </p>
        </div>
      </nav>
    </main>

    sidebar
    <aside>
      <header>
        <h3>Outside</h3>
        <hr />
      </header>

      <nav>
        <section class="dashboard-list">
          <p><ion-icon name="home"></ion-icon> Dashboard</p>
          <p><ion-icon name="stats-chart"></ion-icon> Tables</p>
          <p><ion-icon name="card"></ion-icon> Billing</p>
          <p><ion-icon name="build"></ion-icon> RTL</p>
        </section>

        <h3>ACCOUNT PAGES</h3>

        <section class="account-pages">
          <p><ion-icon name="person"></ion-icon>Dashboard</p>
          <p><ion-icon name="document"></ion-icon>Tables</p>
          <p><ion-icon name="rocket-sharp"></ion-icon>Billing</p>
        </section>
      </nav>

      <section class="help-card"></section>
    </aside>

    <!-- footer -->
    <footer>
      @ 2021, Made with ❤️ by Creative Tim & Simmmple for a better web
    </footer>

    <script
      type="module"
      src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"
    ></script>
  </body>
</html>
